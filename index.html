[hidden]{display:none!important}
:root{--br:#614a3e;--brd:#4a372d;--cr:#EBDDC5;--crl:#F6EFE2;--crd:#D9C7A8;--ink:#3a2c25;--mut:#7a665b;--ok:#4f6b3f;--no:#a4472f;--wh:#fffdf9}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--crl);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,h4{font-family:AntonFT,Impact,sans-serif;font-weight:400;letter-spacing:.03em;text-transform:uppercase;margin:0 0 .4em;color:var(--br)}
h2{font-size:1.7rem}h3{font-size:1.2rem}h4{font-size:1rem;margin:0}
header.top{background:var(--br);color:var(--cr);padding:14px 18px;display:flex;align-items:center;gap:14px}
header.top img{height:46px;width:auto}header.top h1{color:var(--cr);font-size:1.5rem;margin:0}
header.top p{margin:0;font-size:.8rem;opacity:.85;letter-spacing:.1em;text-transform:uppercase}
#tabs{background:var(--cr);border-bottom:2px solid var(--br);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch}
.tab{flex:none;background:none;border:0;padding:13px 16px;font:600 .85rem/1 inherit;font-family:inherit;color:var(--br);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border-bottom:4px solid transparent}
.tab.on{border-bottom-color:var(--br);background:var(--crl)}
main{max-width:940px;margin:0 auto;padding:18px 16px 60px}
.panel{background:var(--wh);border:1px solid var(--crd);border-radius:6px;padding:18px;margin-bottom:16px}
.lead{color:var(--mut);margin:0 0 14px}.mut{color:var(--mut);font-size:.9rem}
label{display:block;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--br)}
select,input[type=text],input:not([type]),input[type=date],textarea{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--crd);border-radius:4px;background:#fff;color:var(--ink);font:inherit;text-transform:none;letter-spacing:0;font-weight:400}
textarea{resize:vertical}select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.grid2,.grid3{display:grid;gap:14px;margin-bottom:14px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}
fieldset{border:1px solid var(--crd);border-radius:4px;margin:0 0 14px;padding:10px 12px}legend{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--br);padding:0 6px}
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rad{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-weight:400;font-size:.95rem;color:var(--ink);border:1px solid var(--crd);padding:9px;border-radius:4px;cursor:pointer}
.rad input{margin-top:4px;accent-color:var(--br)}.rad small{display:block;color:var(--mut);font-size:.8rem}
.info{background:var(--cr);border-left:4px solid var(--br);padding:10px 12px;margin-bottom:14px;font-size:.92rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--br);color:var(--cr);border:1px solid var(--br);padding:10px 18px;border-radius:4px;font:600 .85rem inherit;font-family:inherit;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.btn:hover{background:var(--brd)}.btn.ghost{background:transparent;color:var(--br)}.btn.ghost:hover{background:var(--cr)}.btn.big{padding:13px 26px;font-size:.95rem}
.mini{background:transparent;border:1px solid var(--crd);color:var(--br);padding:4px 10px;border-radius:3px;font:.78rem inherit;font-family:inherit;cursor:pointer}.mini:hover{background:var(--cr)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--br);background:transparent;color:var(--br);padding:7px 14px;border-radius:20px;font:600 .82rem inherit;font-family:inherit;cursor:pointer}.chip.on{background:var(--br);color:var(--cr)}
.seqhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}.seqhead p{margin:0;color:var(--mut)}
.story{display:grid;grid-template-columns:44px 1fr 112px;gap:12px;border-top:1px solid var(--crd);padding:14px 0}
.sn{text-align:center}.sn b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.8rem;color:var(--br);line-height:1}.sn small{font-size:.7rem;color:var(--mut)}
.sb header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:3px;background:var(--cr);color:var(--br);cursor:help}
.tag.pal{background:transparent;border:1px solid var(--crd);color:var(--mut);cursor:default}
.tag.fA{background:#614a3e;color:#EBDDC5}.tag.fB{background:#a58a74;color:#fff}.tag.fC{background:#EBDDC5}.tag.fD{background:#3a2c25;color:#EBDDC5}
dl{margin:0}dt{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-top:7px}dd{margin:1px 0 0}dd.scr{font-weight:600;color:var(--br)}
.fh{font-size:.8rem;color:var(--mut);margin:8px 0}
.phone{position:relative;width:100%;aspect-ratio:9/16;background:linear-gradient(#a58a74,#614a3e);border-radius:10px;overflow:hidden;align-self:start;border:2px solid var(--br)}
.pgrid i{position:absolute;background:rgba(235,221,197,.35)}.pgrid i:first-child{left:50%;top:0;bottom:0;width:1px}.pgrid i:last-child{top:50%;left:0;right:0;height:1px}
.ptxt{position:absolute;top:10%;left:8%;right:8%;text-align:center;color:#EBDDC5;line-height:1.15;font-size:8px}.ptxt b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:11px}.ptxt span{display:block;margin-top:3px}
.pmed{position:absolute;top:38%;left:12%;right:12%;height:28%;border:1px dashed rgba(235,221,197,.7);color:#EBDDC5;font-size:7px;display:flex;align-items:center;justify-content:center;text-align:center}
.pkw{position:absolute;left:0;right:0;top:44%;text-align:center;color:#EBDDC5;font-family:AntonFT,Impact,sans-serif;font-size:19px;letter-spacing:.05em;background:rgba(58,44,37,.5);padding:3px}
.chk{background:var(--crl);border:1px solid var(--crd);border-radius:4px;padding:8px 12px;margin-bottom:8px}.chk summary{cursor:pointer;font-size:.92rem}
.chk ul,.ctal{list-style:none;padding:0;margin:8px 0 0}.chk li,.ctal li{padding:5px 0;font-size:.9rem}.chk li b,.ctal li b{display:inline-block;min-width:68px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}.chk li.ok b,.ctal li.ok b{color:var(--ok)}.chk li.no b,.ctal li.no b{color:var(--no)}.chk small{display:block;margin-left:72px;color:var(--mut)}
.aviso{background:#fbeee2;border-left:4px solid var(--no);padding:10px 12px;font-size:.9rem}.note{font-size:.85rem;color:var(--mut);margin:10px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--cr);border-radius:4px;padding:8px 4px;text-align:center;font-size:.78rem}.day b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;letter-spacing:.05em;color:var(--br);font-size:.95rem}.day.off{background:transparent;border:1px dashed var(--crd);color:var(--mut)}
.dayp summary{cursor:pointer;font-size:1.02rem;padding:2px 0;margin-bottom:6px}.inl{display:flex;align-items:center;gap:8px;margin:0}.inl select{margin:0;width:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.cards ul,.panel ul,.panel ol{padding-left:20px}.cards li{margin-bottom:6px}
.fhd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.fhd h3{margin:0}.tipp{background:var(--cr);padding:8px 12px;border-radius:4px;margin:10px 0 0;font-size:.9rem}

body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.bn{min-height:56px}
/* barra inferior de 6 pestañas: cabe en 360 px sin desbordar */
.bn{font-size:.66rem;letter-spacing:.03em;padding-left:0;padding-right:0;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
@media(max-width:380px){.bn{font-size:.62rem;letter-spacing:.01em}}
/* palabra clave propia: sugerencias + «Escribe la tuya» + avisos (avisan, nunca bloquean) */
.kwbox{margin:2px 0 14px;min-width:0}
.kwlbl{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--br)}
.kwown{margin-top:8px}
.kwin{text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kwwarn:empty{display:none}
.kwwarn{margin-top:8px}
.kwm{margin:0 0 6px;padding:8px 10px;border-left:4px solid var(--crd);background:var(--cr);font-size:.88rem;overflow-wrap:anywhere}
.kwm-no{border-left-color:var(--no);background:#f8ebe5;color:var(--ink)}
.kwm-no b{color:var(--no)}

/* ===== Fam Studio · TikTok (móvil primero, 360-430 px) ===== */
/* selector INSTAGRAM | TIKTOK */
.tt-plat{display:flex;background:var(--cr);border-radius:24px;padding:3px;margin:0 0 14px}
.tt-plat button{flex:1;min-height:44px;border:0;background:transparent;color:var(--br);font:700 .82rem/1 inherit;font-family:inherit;letter-spacing:.1em;text-transform:uppercase;border-radius:20px;cursor:pointer}
.tt-plat button.on{background:var(--br);color:var(--cr)}
/* selectores de dos o tres opciones */
.tt-seg{display:flex;gap:6px;margin:0 0 12px}
.tt-seg button{flex:1;min-height:44px;padding:8px 6px;border:1px solid var(--br);background:transparent;color:var(--br);font:700 .8rem/1.1 inherit;font-family:inherit;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;cursor:pointer}
.tt-seg button.on{background:var(--br);color:var(--cr)}
.tt-chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.tt-fchips{margin:0 0 12px}
.tt-menu .hb{min-height:56px}
/* etiquetas y textos */
.tt-lbl{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:12px 0 2px}
.tt-val{margin:0;font-size:.98rem;overflow-wrap:anywhere}
.tt-kw{display:inline-block;background:var(--br);color:var(--cr);font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:12px;letter-spacing:.07em;overflow-wrap:anywhere}
.tt-ok{display:inline-block;font-size:.76rem;color:var(--ok);border:1px solid var(--ok);border-radius:12px;padding:2px 10px;margin-top:10px}
.tt-note{font-size:.85rem;background:#f3e6cf;border-left:3px solid var(--br);padding:8px 10px;margin-top:10px;border-radius:0 4px 4px 0;overflow-wrap:anywhere}
.tt-aviso{margin-top:10px}
.tt-small{font-size:.78rem;color:var(--mut);margin:8px 0 0}
.tt-card{background:var(--wh);border:1px solid var(--crd);border-radius:6px;padding:4px 14px 14px;margin-bottom:12px}
.tt-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tt-btns .btn{flex:1 1 140px;min-height:48px}
.tt-det{margin:12px 0 0;background:var(--crl);border:1px solid var(--crd);border-radius:4px;padding:0 12px}
.tt-det summary{cursor:pointer;font-size:.92rem;font-weight:600;color:var(--br)}
.tt-det p{margin:4px 0 10px;font-size:.92rem}
/* vista previa 9:16 con el texto encima del vídeo */
.tt-clip{position:relative;width:min(100%,236px);aspect-ratio:9/16;margin:0 auto 14px;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#8c7262,#3d2e27 70%);display:flex;align-items:center;justify-content:center;padding:34px 30px 22px 14px}
.tt-clip:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.18),transparent 55%)}
.tt-clip p{position:relative;margin:0;color:#fff;font-weight:700;font-size:.95rem;line-height:1.3;text-align:center;overflow-wrap:anywhere;text-shadow:0 0 3px #000,0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000}
.tt-dur{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);font-size:.68rem;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:10px}
.tt-side{position:absolute;right:8px;bottom:16px;display:flex;flex-direction:column;gap:10px}
.tt-side i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
/* stories: la fila se desliza dentro de su propio contenedor */
.tt-sitdolor{margin:10px 0 12px;font-size:.92rem}
.tt-stories{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 2px 10px;margin:0 -2px;max-width:100%}
.tt-st{flex:none;position:relative;width:216px;min-height:330px;scroll-snap-align:start;border-radius:10px;padding:34px 14px 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(170deg,#9b8170,#463530)}
.tt-st:nth-child(2){background:linear-gradient(170deg,#7f6a5d,#2f2420)}
.tt-st:nth-child(3){background:linear-gradient(170deg,#b39a86,#5a463b)}
.tt-st.w2{width:244px}
.tt-st.w2:nth-child(2){background:linear-gradient(170deg,#b39a86,#5a463b)}
.tt-stn{position:absolute;top:10px;left:12px;right:12px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.9}
.tt-st p{margin:0;color:#fff;font-weight:700;font-size:.98rem;line-height:1.35;text-align:center;overflow-wrap:anywhere;text-shadow:0 0 3px #000,0 0 2px #000,1px 1px 0 #000}
/* plantillas */
.tt-pli{min-height:56px}
.tt-ph{margin:6px 0 2px}
.tt-pf{display:grid;gap:10px;margin:10px 0 4px}
.tt-pf label{margin:0}
.tt-pf input{margin-top:4px}
.tt-res{background:#2b211c;color:#fff;border-radius:8px;padding:14px;font-weight:700;font-size:.98rem;line-height:1.4;text-align:center;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:60px}
.tt-ej{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--crd);padding:10px 0}
.tt-ej:first-of-type{border-top:0}
.tt-ej p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.tt-ej .mini{flex:none}
/* banco de ideas */
.tt-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tt-tags .tag{cursor:default}
.tt-pant{margin:0 0 4px;font-weight:700;color:var(--br);font-size:1.02rem;overflow-wrap:anywhere}
.tt-count{margin:4px 0 10px}
.tt-bi{margin-bottom:12px}
#tt_bq{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--crd);border-radius:4px;background:#fff;color:var(--ink);font:inherit;text-transform:none;letter-spacing:0;font-weight:400;min-height:44px}
/* historia, bios, semana */
.tt-paso{display:flex;gap:14px;align-items:flex-start}
.tt-paso>div:last-child{min-width:0;flex:1}
.tt-num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--br);color:var(--cr);display:flex;align-items:center;justify-content:center;font-family:AntonFT,Impact,sans-serif;font-size:1.1rem}
.tt-ejem{margin:0 0 8px;background:var(--crl);border-left:4px solid var(--br);padding:8px 10px;border-radius:0 4px 4px 0;overflow-wrap:anywhere}
.tt-bio h4{margin-bottom:6px}
.tt-bl{margin:0 0 6px;font-weight:600;overflow-wrap:anywhere}
.tt-dia{padding-bottom:10px}
.tt-fila{display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--crd);padding:8px 0}
.tt-mt{flex:none;width:64px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tt-fila span:last-child{min-width:0;overflow-wrap:anywhere}
/* Lo que no se dice */
.tt-rl{background:var(--wh);border:1px solid var(--crd);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.tt-rl.tk{border:2px solid var(--br);background:#fbf3e4}
.tt-rlh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.tt-rlh b{font-size:.95rem;color:var(--brd)}
.tt-red{flex:none;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--crd);border-radius:10px;padding:1px 7px}
.tt-rl.tk .tt-red{background:var(--br);color:var(--cr);border-color:var(--br)}
.tt-rl p{position:relative;margin:4px 0;padding-left:64px;font-size:.9rem;min-height:20px;overflow-wrap:anywhere}
.tt-rl p:before{position:absolute;left:0;top:2px;font-size:.62rem;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:3px;color:#fff}
.tt-rl p.no:before{content:"NO";background:#a4472f}
.tt-rl p.si:before{content:"MEJOR";background:var(--ok)}
@media(max-width:380px){.tt-seg button{font-size:.74rem;letter-spacing:.02em}.tt-st{width:200px}.tt-st.w2{width:224px}}

/* ===== Fam Studio · Equipo (móvil primero, 360-430 px) ===== */
.eqhero,.eqh{position:relative;overflow:hidden;border-radius:8px;background:var(--br);margin:0 0 14px;color:var(--cr)}
.eqhero img,.eqh img,.eqc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.eqhero:after,.eqh:after,.eqc:not(.plain):after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(58,44,37,.18) 0%,rgba(58,44,37,.78) 100%)}
.eqhero{min-height:220px;display:flex;align-items:flex-end}
.eqh{min-height:132px;display:flex;align-items:flex-end}
.eqht{position:relative;z-index:1;padding:16px 16px 14px;width:100%}
.eqht h2{color:var(--cr);margin:0;font-size:2rem;line-height:1.05;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.eqhero .eqht h2{font-size:2.6rem}
.eqht p{margin:6px 0 0;color:var(--cr);font-size:.95rem;line-height:1.35}
.eqhero .rbadge{background:var(--cr);color:var(--br);margin-bottom:8px}
/* tarjetas del inicio de Equipo */
.eqcards{display:grid;gap:10px;margin:0 0 16px}
.eqc{position:relative;display:flex;align-items:flex-end;width:100%;min-height:92px;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--br);color:var(--cr);text-align:left;cursor:pointer;font-family:inherit}
.eqc .eqcs{position:relative;z-index:1;display:block;padding:12px 14px;width:100%}
.eqc b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;color:var(--cr)}
.eqc small{display:block;margin-top:3px;font-size:.84rem;color:var(--cr);opacity:.95;line-height:1.3}
.eqc.hoy{outline:3px solid var(--cr);outline-offset:-3px}
.eqc.plain{background:var(--cr);color:var(--br);min-height:72px;align-items:center}
.eqc.plain b{color:var(--br)}.eqc.plain small{color:var(--mut)}
.eqc:focus-visible{outline:3px solid var(--br);outline-offset:2px}
/* filas de enlaces */
.eqls{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.eql{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 12px;border:1px solid var(--crd);border-left:4px solid var(--br);border-radius:6px;background:var(--crl);color:var(--ink);text-decoration:none}
.eql:hover{background:var(--cr)}
.eql:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.eqlt{min-width:0;display:block}
.eqlt b{display:block;font-size:.95rem;line-height:1.3;color:var(--br);overflow-wrap:anywhere}
.eqlt small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-top:2px}
.eqlo{flex:none;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cr);background:var(--br);border-radius:12px;padding:5px 12px}
/* primera semana */
.eqprog{margin:0 0 8px;font-size:.95rem}
.eqbar{height:10px;border-radius:5px;background:var(--cr);overflow:hidden}
.eqbari{display:block;height:100%;background:var(--br);border-radius:5px;transition:width .25s}
.eqwin{margin:12px 0 0;padding:10px 12px;background:var(--br);color:var(--cr);border-radius:6px;font-family:AntonFT,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;text-align:center;font-size:1.15rem}
.eqday summary{display:flex;align-items:center;gap:10px;list-style:none;padding:8px 0}
.eqday summary::-webkit-details-marker{display:none}
.eqdn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--br);color:var(--cr);display:flex;align-items:center;justify-content:center;font-family:AntonFT,Impact,sans-serif;font-size:1.05rem}
.eqdt{flex:1;min-width:0}
.eqdc{flex:none;font-size:.8rem;font-weight:700;color:var(--mut);background:var(--cr);border-radius:12px;padding:3px 10px}
.eqday.done .eqdn{background:var(--ok)}.eqday.done .eqdc{background:var(--ok);color:#fff}
.eqtask{padding:10px 0;border-top:1px solid var(--cr)}
.eqtask:first-child{border-top:0}
.eqcb{display:flex;align-items:flex-start;gap:12px;text-transform:none;letter-spacing:0;font-weight:400;font-size:.95rem;color:var(--ink);cursor:pointer;min-height:44px}
.eqcb input{flex:none;width:24px;height:24px;margin:2px 0 0;accent-color:var(--br)}
.eqcb span{display:block;min-width:0;overflow-wrap:anywhere}
.eqtask .eqls{margin:6px 0 0 36px}
.eqtask .linkb{margin-left:36px}
/* contenido de las vistas */
.eqp{margin:0 0 10px;white-space:pre-line;overflow-wrap:anywhere}
.eqnum{padding-left:22px;margin:6px 0 10px}.eqnum li{margin-bottom:8px;overflow-wrap:anywhere}
.equl{padding-left:20px;margin:6px 0}.equl li{margin-bottom:6px}
.eqdia.hoy{border:2px solid var(--br);background:var(--crl)}
.eqdh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eqdh h3{margin:0}
.eqdd{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.eqhoy{flex:none;background:var(--br);color:var(--cr);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:12px}
.eqhora{margin:4px 0 8px;font-weight:700;color:var(--br);font-size:.9rem}
.eqtemas{padding-left:20px;margin:0 0 8px}
.eqavisos ul{padding-left:20px}.eqavisos li{margin-bottom:6px;font-weight:600}
.eqpais{padding:8px 0;border-top:1px solid var(--cr)}.eqpais:first-child{border-top:0}
.eqpais h4{margin:0 0 2px;font-size:1.05rem}
.eqaviso{margin:0 0 16px;text-align:center}
.eqnota{background:var(--cr);border-left:4px solid var(--br);border-radius:0 6px 6px 0;padding:10px 12px;margin:12px 0;font-size:.93rem}
.eqtips{list-style:none;padding:0!important;margin:6px 0}
.eqtips li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--cr)}.eqtips li:first-child{border-top:0}
.eqtn{flex:none;min-width:34px;font-family:AntonFT,Impact,sans-serif;font-size:1.6rem;line-height:1;color:var(--br)}
.eqtips b{display:block;color:var(--br)}.eqtips small{display:block;color:var(--ink);font-size:.9rem;margin-top:2px}
.eqno{list-style:none;padding:0!important;margin:6px 0}
.eqno li{padding:8px 0 8px 14px;border-left:4px solid var(--no);background:#fbeee2;margin-bottom:8px;border-radius:0 6px 6px 0;padding-right:10px}
.eqcobro h4{margin:8px 0 2px}
.eqorg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eqorg div{background:var(--crl);border:1px solid var(--crd);border-radius:6px;padding:10px}
.eqorg b{display:block;color:var(--br)}.eqorg small{display:block;color:var(--mut);margin-top:2px}
.eqcol{list-style:none;padding:0!important;margin:10px 0}
.eqcol li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.eqcol b{display:block;color:var(--br)}.eqcol small{display:block;color:var(--ink);font-size:.9rem}
.eqdot{flex:none;display:inline-block;width:16px;height:16px;border-radius:50%;margin-top:3px;border:1px solid rgba(0,0,0,.15);vertical-align:middle}
.eqcolores{list-style:none;padding:0!important;display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0}
.eqcolores li{display:flex;gap:8px;align-items:center}
.eqfig{margin:12px 0 0}
.eqfig figcaption{font-size:.82rem;color:var(--mut);margin-top:6px}
.eqshot{display:block;width:100%;max-width:520px}

/* ===== CREAR (banco de paquetes) ===== */
.c2{max-width:560px;margin:0 auto}
.c2tabs{display:flex;gap:6px;margin-bottom:12px}
.c2tabs button{flex:1;border:1px solid var(--br);background:transparent;color:var(--br);font:600 .9rem/1 inherit;font-family:inherit;padding:11px 0;border-radius:22px;cursor:pointer}
.c2tabs button.on{background:var(--br);color:var(--cr)}
.c2step{background:var(--wh);border:1px solid var(--crd);border-radius:8px;padding:13px 14px;margin-bottom:11px}
.c2sn{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.c2sn i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--br);color:var(--cr);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex:none}
.c2sn b{font-size:1rem;color:var(--brd)}
.c2vias{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 8px}
.c2vc{border:2px solid var(--crd);border-radius:10px;padding:11px;text-align:left;cursor:pointer;background:var(--crl);font:inherit;color:var(--ink)}
.c2vc b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;color:var(--br)}
.c2vc small{display:block;font-size:.75rem;color:var(--mut);line-height:1.3;margin-top:2px}
.c2vc.c2p.on{background:var(--br);border-color:var(--br)}.c2vc.c2p.on b,.c2vc.c2p.on small{color:var(--cr)}
.c2vc.c2c.on{background:#fff;border-color:#b5835f;box-shadow:inset 0 0 0 2px #b5835f}.c2vc.c2c.on b{color:#8a5a3c}
.c2chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.c2ch{border:1px solid var(--br);background:transparent;color:var(--br);font:500 .88rem/1.2 inherit;font-family:inherit;padding:8px 12px;border-radius:18px;cursor:pointer;text-align:left}
.c2ch.on{background:var(--br);color:var(--cr)}
.c2nst{margin-bottom:10px}.c2nst small{color:var(--mut);font-size:.8rem}
.c2ex{font-size:.8rem;color:var(--mut);margin:7px 0 0}
.c2when{display:flex;gap:5px;margin-bottom:9px}
.c2when button{flex:1;border:1px solid var(--crd);background:var(--crl);font:600 .75rem/1.2 inherit;font-family:inherit;padding:8px 3px;border-radius:6px;cursor:pointer;color:var(--brd)}
.c2when button small{display:block;font-weight:500;opacity:.8}
.c2when button.on{background:var(--brd);color:var(--cr);border-color:var(--brd)}
.c2when button:disabled{opacity:.45;cursor:default}
.c2q{width:100%;border:1px solid var(--crd);border-radius:6px;padding:10px 12px;font:inherit;font-size:.92rem;background:var(--crl);margin-bottom:6px}
.c2grp{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:10px 0 5px}
.c2sit{display:block;width:100%;text-align:left;border:1px solid var(--crd);background:var(--crl);border-radius:7px;padding:10px 12px;margin-bottom:6px;font:500 .92rem/1.3 inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.c2sit.on{border:2px solid var(--br);background:var(--cr)}
.c2sit small{display:block;color:var(--mut);font-size:.78rem;margin-top:3px;font-weight:400}
.c2hoy{font-size:.65rem;background:var(--ok);color:#fff;border-radius:3px;padding:1px 6px;margin-left:6px;font-weight:700;vertical-align:1px}
.c2fecha{font-size:.62rem;font-weight:700;border-radius:3px;padding:1px 6px;margin-left:6px;background:#b5835f;color:#fff;vertical-align:1px}
details.c2gd{border-bottom:1px solid var(--crd);padding:4px 0}
details.c2gd summary{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--brd);padding:7px 0}
details.c2gd summary span{font-weight:400;color:var(--mut);font-size:.8rem}
details.c2more{background:var(--wh);border:1px dashed var(--crd);border-radius:8px;padding:11px 14px;margin-bottom:12px;font-size:.9rem}
details.c2more summary{cursor:pointer;font-weight:600;color:var(--br)}
.c2go{width:100%;border:0;background:var(--br);color:var(--cr);font:700 .9rem/1 inherit;font-family:inherit;letter-spacing:.08em;padding:15px 0;border-radius:7px;text-transform:uppercase;cursor:pointer}
