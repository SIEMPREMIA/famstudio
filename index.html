[hidden]{display:none!important}
:root{--br:#614a3e;--brd:#4a372d;--cr:#EBDDC5;--crl:#F6EFE2;--crd:#D9C7A8;--ink:#3a2c25;--mut:#7a665b;--ok:#4f6b3f;--no:#a4472f;--wh:#fffdf9}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--crl);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,h4{font-family:AntonFT,Impact,sans-serif;font-weight:400;letter-spacing:.03em;text-transform:uppercase;margin:0 0 .4em;color:var(--br)}
h2{font-size:1.7rem}h3{font-size:1.2rem}h4{font-size:1rem;margin:0}
header.top{background:var(--br);color:var(--cr);padding:14px 18px;display:flex;align-items:center;gap:14px}
header.top .logo{height:46px;width:45px}header.top h1{color:var(--cr);font-size:1.5rem;margin:0}
header.top p{margin:0;font-size:.8rem;opacity:.85;letter-spacing:.1em;text-transform:uppercase}
#tabs{background:var(--cr);border-bottom:2px solid var(--br);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch}
.tab{flex:none;background:none;border:0;padding:13px 16px;font:600 .85rem/1 inherit;font-family:inherit;color:var(--br);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border-bottom:4px solid transparent}
.tab.on{border-bottom-color:var(--br);background:var(--crl)}
main{max-width:940px;margin:0 auto;padding:18px 16px 60px}
.panel{background:var(--wh);border:1px solid var(--crd);border-radius:6px;padding:18px;margin-bottom:16px}
.lead{color:var(--mut);margin:0 0 14px}.mut{color:var(--mut);font-size:.9rem}
label{display:block;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--br)}
select,input[type=text],input:not([type]),input[type=date],textarea{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--crd);border-radius:4px;background:#fff;color:var(--ink);font:inherit;text-transform:none;letter-spacing:0;font-weight:400}
textarea{resize:vertical}select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.grid2,.grid3{display:grid;gap:14px;margin-bottom:14px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}
fieldset{border:1px solid var(--crd);border-radius:4px;margin:0 0 14px;padding:10px 12px}legend{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--br);padding:0 6px}
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rad{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-weight:400;font-size:.95rem;color:var(--ink);border:1px solid var(--crd);padding:9px;border-radius:4px;cursor:pointer}
.rad input{margin-top:4px;accent-color:var(--br)}.rad small{display:block;color:var(--mut);font-size:.8rem}

.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--br);color:var(--cr);border:1px solid var(--br);padding:10px 18px;border-radius:4px;font:600 .85rem inherit;font-family:inherit;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.btn:hover{background:var(--brd)}.btn.ghost{background:transparent;color:var(--br)}.btn.ghost:hover{background:var(--cr)}.btn.big{padding:13px 26px;font-size:.95rem}
.mini{background:transparent;border:1px solid var(--crd);color:var(--br);padding:4px 10px;border-radius:3px;font:.78rem inherit;font-family:inherit;cursor:pointer}.mini:hover{background:var(--cr)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--br);background:transparent;color:var(--br);padding:7px 14px;border-radius:20px;font:600 .82rem inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--br);color:var(--cr)}

.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:3px;background:var(--cr);color:var(--br);cursor:help}

dl{margin:0}dt{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-top:7px}dd{margin:1px 0 0}

.ctal{list-style:none;padding:0;margin:8px 0 0}.ctal li{padding:5px 0;font-size:.9rem}.ctal li b{display:inline-block;min-width:68px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}.ctal li.ok b{color:var(--ok)}.ctal li.no b{color:var(--no)}
.aviso{background:#fbeee2;border-left:4px solid var(--no);padding:10px 12px;font-size:.9rem}.note{font-size:.85rem;color:var(--mut);margin:10px 0 0}

.inl{display:flex;align-items:center;gap:8px;margin:0}.inl select{margin:0;width:auto}
.panel ul,.panel ol{padding-left:20px}
.tipp{background:var(--cr);padding:8px 12px;border-radius:4px;margin:10px 0 0;font-size:.9rem}

.gridwrap{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-top:8px}
.gphone{position:relative;width:230px;aspect-ratio:9/16;background:linear-gradient(#a58a74,#614a3e);border:3px solid var(--br);border-radius:16px;overflow:hidden}
.q{position:absolute;width:50%;height:50%;border:1px dashed rgba(235,221,197,.75)}.q i{position:absolute;font-style:normal;font-family:AntonFT,Impact,sans-serif;color:rgba(235,221,197,.6);font-size:1.6rem;top:4px;left:8px}
.q1{left:0;top:0}.q2{right:0;top:0}.q3{left:0;bottom:0}.q4{right:0;bottom:0}
.gm{position:absolute;left:0;right:0;background:rgba(58,44,37,.55)}.gm.top{top:0;height:13%}.gm.bot{bottom:0;height:13%}
.gt{position:absolute;top:15%;left:10%;right:10%;text-align:center;color:#EBDDC5}.gt b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.55rem;line-height:1.1;text-transform:uppercase}.gt span{font-size:.75rem}
.gmed{position:absolute;top:38%;left:12%;right:12%;height:27%;border:1px dashed #EBDDC5;color:#EBDDC5;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.gkw{position:absolute;left:0;right:0;top:45%;text-align:center;font-family:AntonFT,Impact,sans-serif;font-size:2.6rem;color:#EBDDC5;letter-spacing:.06em;text-shadow:3px 3px 0 #3a2c25}
.gb{position:absolute;bottom:15%;left:10%;right:10%;text-align:center;color:#EBDDC5;font-size:.72rem}
.gtxt ul{padding-left:18px}.gtxt li{margin-bottom:6px;font-size:.93rem}
mark{background:#f2d3c4;padding:0 2px;border-radius:2px}mark.medio{background:#f6e7b8}
.rtxt{background:var(--crl);border:1px solid var(--crd);padding:12px;border-radius:4px;margin-bottom:12px}.hits{list-style:none;padding:0!important}.hits li{padding:8px 0;border-top:1px solid var(--crd)}
.lv{font-size:.7rem;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:#f2d3c4}.lv.medio{background:#f6e7b8}.okb{color:var(--ok)}
.gd summary{cursor:pointer;font-family:AntonFT,Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--br);font-size:1.1rem}.gb2{padding-top:10px}
.gl dt{margin-top:8px;color:var(--br)}.gl dd{margin:0}
.gd2 pre{white-space:pre-wrap;background:var(--crl);padding:10px;border-radius:4px;font:.85rem/1.5 inherit}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--br);color:var(--cr);padding:9px 18px;border-radius:4px;opacity:0;transition:.2s;pointer-events:none;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
footer{background:var(--br);color:var(--cr);text-align:center;padding:22px 16px;font-family:AntonFT,Impact,sans-serif;letter-spacing:.2em;text-transform:uppercase}footer small{display:block;font-family:inherit;font-size:.7rem;opacity:.7;margin-top:6px;letter-spacing:.1em}
@media(max-width:700px){.grid2,.grid3,.radios{grid-template-columns:1fr}.gridwrap{grid-template-columns:1fr;justify-items:center}h2{font-size:1.4rem}header.top .logo{height:38px;width:37px}.panel{padding:14px}}
@media print{#tabs,footer,.acts,.mini{display:none}}
label small{text-transform:none;letter-spacing:0;font-weight:400;display:block;margin-top:4px}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.kws .chip{padding:5px 11px;font-size:.75rem;letter-spacing:.04em}
.steps{padding-left:22px}.steps li{margin-bottom:10px}.hero{border-top:4px solid var(--br)}
/* ===== Fam Studio ===== */
html,body{min-height:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
header.top{padding-top:max(14px,env(safe-area-inset-top,0px))}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--cr);border-top:2px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn{flex:1;background:none;border:0;padding:14px 2px 13px;font:700 .72rem/1 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);cursor:pointer;border-top:3px solid transparent;margin-top:-2px}
.bn.on{color:var(--br);border-top-color:var(--br)}
.back{background:none;border:0;color:var(--br);font:600 .9rem inherit;font-family:inherit;padding:0 0 12px;cursor:pointer}

:root{--mut:#6e5a4f;--no:#963e28}

.eqcb span{display:block;min-width:0;overflow-wrap:anywhere}

.eqtask .linkb{margin-left:36px}
/* contenido de las vistas */
.eqp{margin:0 0 10px;white-space:pre-line;overflow-wrap:anywhere}
.eqnum{padding-left:22px;margin:6px 0 10px}.eqnum li{margin-bottom:8px;overflow-wrap:anywhere}
.equl{padding-left:20px;margin:6px 0}.equl li{margin-bottom:6px}

.eqdh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.eqdd{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.eqhoy{flex:none;background:var(--br);color:var(--cr);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:12px}

.eqtemas{padding-left:20px;margin:0 0 8px}
.eqavisos ul{padding-left:20px}.eqavisos li{margin-bottom:6px;font-weight:600}
.eqpais{padding:8px 0;border-top:1px solid var(--cr)}.eqpais:first-child{border-top:0}
.eqpais h4{margin:0 0 2px;font-size:1.05rem}
.eqaviso{margin:0 0 16px;text-align:center}
.eqnota{background:var(--cr);border-left:4px solid var(--br);border-radius:0 6px 6px 0;padding:10px 12px;margin:12px 0;font-size:.93rem}
.eqtips{list-style:none;padding:0!important;margin:6px 0}
.eqtips li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--cr)}.eqtips li:first-child{border-top:0}
.eqtn{flex:none;min-width:34px;font-family:AntonFT,Impact,sans-serif;font-size:1.6rem;line-height:1;color:var(--br)}
.eqtips b{display:block;color:var(--br)}.eqtips small{display:block;color:var(--ink);font-size:.9rem;margin-top:2px}
.eqno{list-style:none;padding:0!important;margin:6px 0}
.eqno li{padding:8px 0 8px 14px;border-left:4px solid var(--no);background:#fbeee2;margin-bottom:8px;border-radius:0 6px 6px 0;padding-right:10px}
.eqcobro h4{margin:8px 0 2px}
.eqorg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eqorg div{background:var(--crl);border:1px solid var(--crd);border-radius:6px;padding:10px}
.eqorg b{display:block;color:var(--br)}.eqorg small{display:block;color:var(--mut);margin-top:2px}
.eqcol{list-style:none;padding:0!important;margin:10px 0}
.eqcol li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.eqcol b{display:block;color:var(--br)}.eqcol small{display:block;color:var(--ink);font-size:.9rem}
.eqdot{flex:none;display:inline-block;width:16px;height:16px;border-radius:50%;margin-top:3px;border:1px solid rgba(0,0,0,.15);vertical-align:middle}
.eqcolores{list-style:none;padding:0!important;display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0}
.eqcolores li{display:flex;gap:8px;align-items:center}
.eqfig{margin:12px 0 0}
.eqfig figcaption{font-size:.82rem;color:var(--mut);margin-top:6px}
.eqshot{display:block;width:100%;max-width:520px}

/* ===== CREAR (banco de paquetes) ===== */
.c2{max-width:560px;margin:0 auto}
.c2tabs{display:flex;gap:6px;margin-bottom:12px}
.c2tabs button{flex:1;border:1px solid var(--br);background:transparent;color:var(--br);font:600 .9rem/1 inherit;font-family:inherit;padding:11px 0;border-radius:22px;cursor:pointer}
.c2tabs button.on{background:var(--br);color:var(--cr)}
.c2step{background:var(--wh);border:1px solid var(--crd);border-radius:8px;padding:13px 14px;margin-bottom:11px}
.c2sn{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.c2sn i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--br);color:var(--cr);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex:none}
.c2sn b{font-size:1rem;color:var(--brd)}
.c2vias{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 8px}
.c2vc{border:2px solid var(--crd);border-radius:10px;padding:11px;text-align:left;cursor:pointer;background:var(--crl);font:inherit;color:var(--ink)}
.c2vc b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;color:var(--br)}
.c2vc small{display:block;font-size:.75rem;color:var(--mut);line-height:1.3;margin-top:2px}
.c2vc.c2p.on{background:var(--br);border-color:var(--br)}.c2vc.c2p.on b,.c2vc.c2p.on small{color:var(--cr)}
.c2vc.c2c.on{background:#fff;border-color:#b5835f;box-shadow:inset 0 0 0 2px #b5835f}.c2vc.c2c.on b{color:#8a5a3c}
.c2chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.c2ch{border:1px solid var(--br);background:transparent;color:var(--br);font:500 .88rem/1.2 inherit;font-family:inherit;padding:8px 12px;border-radius:18px;cursor:pointer;text-align:left}
.c2ch.on{background:var(--br);color:var(--cr)}
.c2nst{margin-bottom:10px}.c2nst small{color:var(--mut);font-size:.8rem}
.c2ex{font-size:.8rem;color:var(--mut);margin:7px 0 0}
.c2when{display:flex;gap:5px;margin-bottom:9px}
.c2when button{flex:1;border:1px solid var(--crd);background:var(--crl);font:600 .75rem/1.2 inherit;font-family:inherit;padding:8px 3px;border-radius:6px;cursor:pointer;color:var(--brd)}
.c2when button small{display:block;font-weight:500;opacity:.8}
.c2when button.on{background:var(--brd);color:var(--cr);border-color:var(--brd)}
.c2when button:disabled{opacity:.45;cursor:default}
.c2q{width:100%;border:1px solid var(--crd);border-radius:6px;padding:10px 12px;font:inherit;font-size:.92rem;background:var(--crl);margin-bottom:6px}
.c2grp{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:10px 0 5px}
.c2sit{display:block;width:100%;text-align:left;border:1px solid var(--crd);background:var(--crl);border-radius:7px;padding:10px 12px;margin-bottom:6px;font:500 .92rem/1.3 inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.c2sit.on{border:2px solid var(--br);background:var(--cr)}
.c2sit small{display:block;color:var(--mut);font-size:.78rem;margin-top:3px;font-weight:400}
.c2hoy{font-size:.65rem;background:var(--ok);color:#fff;border-radius:3px;padding:1px 6px;margin-left:6px;font-weight:700;vertical-align:1px}
.c2fecha{font-size:.62rem;font-weight:700;border-radius:3px;padding:1px 6px;margin-left:6px;background:#b5835f;color:#fff;vertical-align:1px}
details.c2gd{border-bottom:1px solid var(--crd);padding:4px 0}
details.c2gd summary{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--brd);padding:7px 0}
details.c2gd summary span{font-weight:400;color:var(--mut);font-size:.8rem}
details.c2more{background:var(--wh);border:1px dashed var(--crd);border-radius:8px;padding:11px 14px;margin-bottom:12px;font-size:.9rem}
details.c2more summary{cursor:pointer;font-weight:600;color:var(--br)}
.c2go{width:100%;border:0;background:var(--br);color:var(--cr);font:700 .9rem/1 inherit;font-family:inherit;letter-spacing:.08em;padding:15px 0;border-radius:7px;text-transform:uppercase;cursor:pointer}
.c2ban{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;border-radius:6px;margin-bottom:10px;gap:8px}
.c2ban.p{background:#3f2f27;color:var(--cr)}.c2ban.c{background:#f1e2d3;color:#8a5a3c;border:2px solid #b5835f}
.c2ban small{font-weight:500;letter-spacing:0;text-transform:none;opacity:.9}
.c2sum{background:var(--br);color:var(--cr);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:.92rem}
.c2sum b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
.c2 .kwbox{margin-bottom:12px}
.c2card{background:var(--wh);border:1px solid var(--crd);border-radius:10px;padding:13px;margin-bottom:13px}
.c2h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.c2h i{font-style:normal;font-family:AntonFT,Impact,sans-serif;font-size:1.6rem;color:var(--br);line-height:1}
.c2h b{font-size:.88rem;color:var(--brd);text-transform:uppercase;letter-spacing:.06em;flex:1}
.c2story{position:relative;width:100%;max-width:330px;margin:0 auto 11px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#b9a08c,#8a7262 55%,#5b463b)}
.c2hook{position:absolute;top:6%;left:7%;right:7%;text-align:center;font-weight:800;font-size:1.02rem;line-height:1.25}
.c2hook span{background:rgba(255,255,255,.93);color:#2b211c;padding:2px 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.6}
.c2story.tt .c2hook{font-size:.92rem}
.c2poll{position:absolute;left:14%;right:14%;top:58%;background:#fff;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.c2poll span{padding:9px 4px;text-align:center;font-size:.78rem;font-weight:700;color:#2b211c;border-right:1px solid #eee}
.c2kwz{position:absolute;left:6%;right:6%;bottom:4%;background:var(--cr);border-radius:10px;padding:8px 8px 9px;text-align:center}
.c2kwz small{display:block;font-size:.7rem;font-weight:700;color:var(--brd);line-height:1.25}
.c2kwz strong{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:2.3rem;line-height:1.05;color:var(--br);letter-spacing:.04em;word-break:break-all}
.c2three{display:grid;gap:8px}
.c2t3{border-left:3px solid var(--br);padding:3px 0 3px 10px;margin-top:6px}
.c2t3 em{font-style:normal;display:block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.c2t3 p{margin:2px 0 0;font-size:.92rem}
.c2t3.w p{font-weight:700;color:var(--brd)}
.c2card>.mini,.c2guia .mini{margin-top:9px}
.c2meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.c2meta span{font-size:.74rem;border:1px solid var(--crd);border-radius:10px;padding:2px 9px;background:var(--crl)}
.c2board{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin:9px 0}
.c2fr{position:relative;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,#b9a08c,#6f5849)}
.c2fr em{position:absolute;top:3px;left:5px;font-style:normal;font-size:.65rem;color:#fff;font-weight:700}
.c2fr p{position:absolute;left:3px;right:3px;top:20%;margin:0;font-size:.58rem;line-height:1.2;color:#2b211c;background:rgba(255,255,255,.92);padding:2px;text-align:center;font-weight:700}
.c2kwm{position:absolute;left:3px;right:3px;bottom:5px;background:var(--cr);border-radius:4px;text-align:center;font:400 .8rem/1.3 AntonFT,Impact,sans-serif;color:var(--br);word-break:break-all}
.c2pl{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;font-size:.88rem;margin:5px 0}
.c2pl i{font-style:normal;font-weight:700;color:var(--br)}.c2pl small{color:var(--mut)}
.c2note{font-size:.84rem;background:#f3e6cf;border-left:3px solid var(--br);padding:8px 10px;margin:9px 0;border-radius:0 4px 4px 0}
.c2tl{margin:2px 0 11px}.c2tlb{position:relative;height:18px;background:var(--crl);border-radius:4px;margin-bottom:3px}
.c2tlb span{position:absolute;inset:0;background:var(--br);color:var(--cr);font-size:.64rem;font-weight:700;display:flex;align-items:center;padding-left:7px;border-radius:4px}
.c2tlb.s span{background:#b5835f}.c2tlx{display:flex;justify-content:space-between;font-size:.66rem;color:var(--mut)}
.c2how{display:grid;gap:10px}.c2hw{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start}
.c2hw i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--br);color:var(--cr);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.c2hw b{font-size:.92rem;color:var(--brd)}.c2hw p{margin:2px 0 0;font-size:.88rem}
.c2hw p.big{font-weight:700;background:var(--cr);padding:7px 9px;border-radius:5px}
details.c2card summary{cursor:pointer;list-style:none;position:relative;padding-right:78px}
details.c2card summary b{display:block;color:var(--br);font-size:.95rem;text-transform:uppercase;letter-spacing:.05em}
details.c2card summary small{display:block;color:var(--mut);font-size:.82rem}
details.c2card summary::-webkit-details-marker{display:none}
details.c2card summary:after{content:"Ver";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:.78rem;font-weight:700;color:var(--br);border:1px solid var(--br);border-radius:12px;padding:2px 10px}
details.c2card[open] summary:after{content:"Ocultar"}
.c2pre{white-space:pre-wrap;font:inherit;font-size:.9rem;background:var(--crl);border:1px solid var(--crd);border-radius:6px;padding:10px 12px;margin:8px 0 0}
.c2acts{display:grid;gap:8px;margin:6px 0 12px}
.c2chk{background:var(--wh);border:1px solid var(--crd);border-radius:8px;padding:11px 13px;font-size:.88rem}
.c2chk b{display:block;margin-bottom:4px;color:var(--brd)}.c2chk div{margin:3px 0}
.c2chk div:before{content:"";display:inline-block;width:11px;height:11px;border:1.5px solid var(--br);border-radius:2px;margin-right:7px;vertical-align:-1px}
.c2lbl{display:block;font-weight:600;color:var(--brd);margin-top:8px}.c2lbl select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--crd);border-radius:6px;background:var(--crl);font:inherit}

.c2srow{border-top:1px solid var(--crd);padding:10px 0;display:grid;gap:3px}
.c2srow small{color:var(--mut);font-size:.8rem}.c2srow .mini{justify-self:start;margin-top:4px}

/* paso 3: temas */
.c2tot{margin:0 0 8px}.c2tot b{color:var(--br)}
.c2temas{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.c2temas.off{opacity:.45}
.c2temas button{border:1px solid var(--crd);background:var(--crl);color:var(--brd);border-radius:18px;padding:8px 13px;font:600 .86rem/1.1 inherit;font-family:inherit;cursor:pointer}
.c2temas button small{font-weight:500;opacity:.7;margin-left:2px}
.c2temas button.hoy{border-color:var(--ok)}
.c2temas button.on{background:var(--brd);color:var(--cr);border-color:var(--brd)}
.c2sub{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;scrollbar-width:none}
.c2sub::-webkit-scrollbar{display:none}
.c2sub button{flex:none;border:1px solid var(--br);background:transparent;color:var(--br);border-radius:14px;padding:6px 11px;font:600 .78rem/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.c2sub button.on{background:var(--br);color:var(--cr)}
.c2sub button small{opacity:.7}
.c2tema{display:block;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a5a3c;margin-bottom:3px}
/* pregunta 2: intenciones con su explicación */
.c2obs{display:flex;flex-direction:column;gap:7px}
.c2ob{display:block;width:100%;text-align:left;border:1px solid var(--crd);background:var(--crl);border-radius:9px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.c2ob b{display:block;font-size:.95rem}
.c2ob small{display:block;color:var(--mut);font-size:.8rem;margin-top:2px;line-height:1.35}
.c2ob.on{background:var(--br);border-color:var(--br);color:var(--cr)}
.c2ob.on small{color:var(--cr)}
/* reel: tipo, estructura en tres partes */
.c2rt{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:7px;margin-bottom:11px}
.c2rt .c2ch{display:block;border-radius:12px;padding:9px 10px}
.c2rt .c2ch b{display:block;font-size:.88rem}
.c2rt .c2ch small{display:block;font-size:.72rem;font-weight:400;line-height:1.3;margin-top:2px;opacity:.85}
.c2ang{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a5a3c;border:1px solid #b5835f;border-radius:10px;padding:1px 8px;margin:0 0 4px}
.c2ay{display:block;font-size:.76rem;color:var(--mut);line-height:1.35;margin-top:3px}
.c2sx{margin:2px 0 8px}
.c2t3 .c2pl{margin:6px 0}
.c2bd{margin:2px 0 0;font-size:.92rem}.c2bd>b{display:block;margin-bottom:2px}.c2t3.w .c2bd{font-weight:700;color:var(--brd)}
.c2kwbig{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:2rem;line-height:1.1;letter-spacing:.04em;color:var(--br);word-break:break-all;margin-top:6px}
.c2kwcap{display:block;font-size:.76rem;color:var(--mut);font-weight:400}
.c2part{margin-top:10px}
.c2big{font-size:1.02rem!important;font-weight:700;color:var(--brd);line-height:1.3}
.c2fn{display:block;font-size:.84rem;margin-top:5px;line-height:1.35}
.c2part .mini{margin-top:7px}
details.c2mnt{margin:11px 0 4px}
.c2stp{margin:8px 0 0;padding-left:20px;font-size:.88rem}.c2stp li{margin-bottom:6px}
.c2card{overflow-wrap:anywhere}
/* ---- fotos de ejemplo (FOTOS, src/fotos.js) ---- */
.c2ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s;z-index:0}
.fok>.c2ph{opacity:1}
.c2story.fok::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(24,14,9,.52) 0,rgba(24,14,9,.2) 24%,rgba(24,14,9,0) 40%,rgba(24,14,9,0) 54%,rgba(24,14,9,.2) 74%,rgba(24,14,9,.56) 100%)}

.c2story.fok .c2poll,.c2story.fok .c2kwz{z-index:2}
.c2story.fok .c2hook span{box-shadow:0 1px 5px rgba(0,0,0,.28)}
.c2fl{position:absolute;left:7px;top:7px;z-index:3;background:rgba(18,10,6,.66);color:#fff;font-size:.625rem;font-weight:600;line-height:1;letter-spacing:.02em;padding:4px 7px 5px;border-radius:99px;pointer-events:none}
/* sin foto (no hay tipo, no hay paquete o falla la descarga): el bloque de texto solo, sin dibujo de relleno ni marco de foto vacío */
.c2story.c2sf{aspect-ratio:auto;max-width:none;background:var(--crl);border:1px solid var(--crd);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:visible}
.c2story.c2sf .c2hook{position:static;text-align:left;color:var(--brd)}
.c2story.c2sf .c2hook span{background:none;padding:0;color:var(--brd);line-height:1.35}
.c2story.c2sf .c2poll{position:static;margin:0;box-shadow:none;border:1px solid var(--crd)}
.c2story.c2sf .c2kwz{position:static;background:var(--cr)}
.c2pf{display:flex;gap:10px;align-items:flex-start}
.c2pf .c2big{flex:1;min-width:0;margin:0}
.c2pf .c2th{margin-top:2px}
.c2th{position:relative;display:block;flex:none;width:54px;height:96px;border-radius:7px;overflow:hidden;background:#d8c8bb}
.c2th.nof,.c2pi.nof{display:none}
.c2pl.c2plt{grid-template-columns:22px 1fr auto;align-items:start}
.c2ideas{margin-top:3px}
.c2idea{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;font-size:.92rem}

/* 2) todo lo que se pulsa, 44 px como mínimo */
button,summary,.btn,.mini,.chip,.linkb,select,input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=hidden]):not([type=file]),a.eql{min-height:44px}

.mini{padding:6px 14px}

.c2tabs,.c2temas,.c2sub,.c2obs,.c2rt,.chips,.kws,.c2chips,.c2when,.plstrip,.acts{gap:8px}

.plstrip{grid-template-columns:repeat(4,1fr)}

.plck{width:44px!important;height:44px!important}
.plit{grid-template-columns:44px 1fr}
.plsc,.x5c{gap:8px}
/* 4) ningún texto por debajo de 13 px (las reglas con !important ganan a las de cada pantalla; todas eran más pequeñas) */
label,legend,dt,th,figcaption{font-size:.8125rem}
.c2srow small,.c2srow small b,.c2gd summary span,.eqlt small,.eqlo,.tt-lbl,.tt-red,.ritem small,.rtag,.rkw,.rver,.rbadge,button small,.c2sit small,.tag,.lv,.c2t3 em,.c2tema,.c2fecha,.c2hoy,.c2grp,.c2ex,.c2ex b,.c2ay,.c2ban,.c2ban small,.c2meta span,.c2tlb span,.c2tlx b,.c2kwcap,.c2kwz small,.c2poll span,.c2ang,.c2sn i,.plmini,.plleg,.pld small,.pld i,.eqdc,.eqdd,.eqhoy,.x5d,.grid2 label small,.grid3 label small,label small,.kwlbl,.kwown,.plrow label,.kws .chip,.rkwc,.gt span,.gmed,.gb,header.top p,.c2fr p,.c2fr em,.c2kwm,.rtab,.rtab th,.rtab td,.hooks .tag,.xmin,.tt-rl p:before,.c2part small{font-size:.8125rem!important}
.c2t3 em,.c2grp,.tag,.rbadge,.plmini{letter-spacing:.05em}

.mg,.c2nst small{font-size:.8125rem!important}

header.top{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
#bnav{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.c2fix{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:8px;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--crl);border-top:1px solid var(--crd);box-shadow:0 -4px 10px rgba(58,44,37,.1)}

.fx-obj{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px;font-size:.9375rem;color:var(--mut)}

.fx-w25{width:25%}.fx-w30{width:30%}.fx-w35{width:35%}.fx-w40{width:40%}.fx-w45{width:45%}
.fx-w50{width:50%}.fx-w55{width:55%}.fx-w60{width:60%}.fx-w65{width:65%}.fx-w70{width:70%}
.fx-w75{width:75%}.fx-w80{width:80%}.fx-w85{width:85%}.fx-w90{width:90%}.fx-w95{width:95%}

/* ===== C4 · lo visual: ilustraciones, bienvenida, estados vacíos y movimiento ===== */
/* ilustraciones: trazo marrón fino, rellenos crema y un tono cálido */
.il{display:block;width:100%;height:auto;overflow:visible}
.il .s{fill:none;stroke:#614a3e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.il .th{stroke-width:7}.il .th2{stroke:#D39C74;stroke-width:3}
.il .n{stroke:none}
.il .f1{fill:#EBDDC5}.il .f2{fill:#D39C74}.il .f3{fill:#FFFDF9}.il .d1{fill:#614a3e}
.il .d{stroke-dasharray:2 5}
.il .rd0,.il .rd1,.il .rd2{fill:none;stroke-linecap:round}
.il .rd0{stroke:#614a3e;stroke-width:21}.il .rd1{stroke:#EBDDC5;stroke-width:17}.il .rd2{stroke:#D39C74;stroke-width:2;stroke-dasharray:3 7}
.il-s{width:132px;margin:0 auto 6px}

/* estados vacíos */
.vacio{text-align:center;padding:6px 0 2px}
.vacio-t{margin:0 auto 14px!important;max-width:30em;font-size:1rem;color:var(--ink)}
.vacio .btn{margin:0 auto}
.vacio.panel,.panel.vacio{padding-top:18px}

/* cabecera discreta de Inicio */
.hi-fila{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 2px;min-height:64px}
.hi-fila .hi{margin:0 0 6px;font-size:1.15rem;font-weight:600;color:var(--br)}
.hi-il{flex:none;width:92px;opacity:.95}

/* barra de carga inicial */
.sp-bar{width:min(220px,60vw);height:4px;border-radius:2px;background:rgba(235,221,197,.25);overflow:hidden;margin-top:2px}
.sp-bar i{display:block;height:100%;width:100%;background:var(--cr);border-radius:2px;transform-origin:left;transform:scaleX(var(--p,.08));transition:transform .3s ease-out}
.sp-bar.ind i{width:40%;transform:none;animation:spind 1.2s ease-in-out infinite}
@keyframes spind{from{margin-left:-40%}to{margin-left:100%}}

/* movimiento: entrada suave de cada pantalla (solo se repite al cambiar de pantalla) */
@keyframes vin{from{opacity:0}to{opacity:1}}
@keyframes vup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vis-in>section,.vis-in>.hqs,.vis-in>.hi-fila,.vis-in>.c2tabs{animation:vup .28s ease-out both}
.vis-in>:nth-child(2){animation-delay:40ms}.vis-in>:nth-child(3){animation-delay:80ms}.vis-in>:nth-child(4){animation-delay:120ms}.vis-in>:nth-child(n+5){animation-delay:150ms}
/* las tarjetas de un resultado de Crear aparecen una tras otra */
.vis-in .c2card{animation:vup .3s ease-out both}
.vis-in .c2card:nth-of-type(2){animation-delay:50ms}.vis-in .c2card:nth-of-type(3){animation-delay:100ms}.vis-in .c2card:nth-of-type(4){animation-delay:150ms}.vis-in .c2card:nth-of-type(5){animation-delay:200ms}.vis-in .c2card:nth-of-type(n+6){animation-delay:240ms}
/* los botones responden al toque */
button,.btn,.mini,.chip{transition:transform .15s ease,background-color .15s ease,color .15s ease,border-color .15s ease,opacity .15s ease}
button:not(:disabled):active{transform:scale(.97)}
.bn:active{transform:none;opacity:.7}
/* «Tu semana»: los puntos y las barras se llenan al entrar */
.vis-in .fx-dots i.on{animation:vfill .32s ease-out both}
.vis-in .fx-dots i.on:nth-child(2){animation-delay:70ms}.vis-in .fx-dots i.on:nth-child(3){animation-delay:140ms}.vis-in .fx-dots i.on:nth-child(4){animation-delay:210ms}.vis-in .fx-dots i.on:nth-child(n+5){animation-delay:280ms}
@keyframes vfill{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.vis-in .fx-bar i,.vis-in .sm-bars i.on{transform-origin:left;animation:vgrow .45s ease-out .1s both}
@keyframes vgrow{from{transform:scaleX(0)}to{transform:none}}
/* al cumplir el objetivo: una marca que se dibuja y un borde que se asienta, sin confeti */
.fx-cum-ok{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin-right:6px;color:var(--ok)}
.fx-cum-ok circle{fill:none;stroke:currentColor;stroke-width:1.8;opacity:.35}
.fx-cum-ok path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:0}
.vis-in .fx-cum-ok path{animation:vdraw .5s ease-out .25s both}
@keyframes vdraw{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.fx-sem.fx-cum{border-left-color:var(--ok)}
.vis-in .fx-sem.fx-cum{animation:vup .28s ease-out both,vborde .8s ease-out .2s both}
@keyframes vborde{0%{box-shadow:0 0 0 0 rgba(79,107,63,.0)}40%{box-shadow:0 0 0 4px rgba(79,107,63,.18)}100%{box-shadow:0 0 0 0 rgba(79,107,63,0)}}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
 button:not(:disabled):active{transform:none}
}

@keyframes bvout{to{opacity:0}}
.bv-top{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:6px 10px 0 22px}
.tt-n{font:700 .8125rem inherit;font-family:inherit;letter-spacing:.14em;color:var(--mut)}
.bv-saltar{min-width:64px;min-height:44px;padding:0 14px;border:0;border-radius:22px;background:none;color:var(--br);font:600 1rem inherit;font-family:inherit;cursor:pointer}
.bv-pasa{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;outline:0}
.bv-pasa::-webkit-scrollbar{display:none}
.bv-p{flex:none;width:100%;min-height:0;display:flex;flex-direction:column;box-sizing:border-box;padding:0 20px 6px;scroll-snap-align:center;scroll-snap-stop:always}
.bv-p h2{margin:0 0 8px;font-size:clamp(1.6rem,7.2vw,2.05rem);line-height:1.1;transition:opacity .5s .1s,transform .5s .1s}
.bv-p>p{margin:0 0 12px;max-width:24em;font-size:1rem;line-height:1.4;color:var(--ink);transition:opacity .5s .2s,transform .5s .2s}
.bv-p:not(.on) h2,.bv-p:not(.on)>p{opacity:.15;transform:translateY(8px)}
.bv-p .esc-host{flex:1;min-height:0}
.bv-pie{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 24px 20px}
.bv-pts{display:flex;gap:8px}
.bv-pts i{width:8px;height:8px;border-radius:4px;background:var(--crd);transition:width .25s ease,background-color .25s ease}
.bv-pts i.on{width:26px;background:var(--br)}
.bv-sig{width:100%;max-width:340px}
.tt-ins{flex:1;min-height:0;display:flex;flex-direction:column;padding:34px 20px 0;box-sizing:border-box}.tt-ins:not(:has(.esc-host)){justify-content:center;padding-top:0}
.tt-ins h2{margin:0 0 8px;font-size:clamp(1.6rem,7.2vw,2.05rem);line-height:1.1}
.tt-ins>p{margin:0 0 10px;max-width:24em;font-size:1rem;line-height:1.4;color:var(--ink)}
.tt-ins .esc-host{flex:1;min-height:0}
.tt-av{margin:0 0 10px;padding:9px 12px;border-left:4px solid var(--no);border-radius:4px;background:#fbeee2;font-size:.9375rem;line-height:1.4}
.tt-bt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 24px 20px}
.tt-bt .btn{width:100%;max-width:340px}
@media(max-height:660px){.bv-p>p{margin-bottom:6px;font-size:.9375rem}.bv-pie{padding-bottom:12px;gap:10px}}
@media(prefers-reduced-motion:reduce){.esc-dv.ent,.esc-rot.sw,.m-pg.on,.m-pg.out{animation:none}.bv-p h2,.bv-p>p{transition:none}}
.in-es{margin:6px 0 14px}

/* ===== C5 · repaso de pantalla en pantalla: contraste, anchos, texto grande y barras fijas ===== */
:root{--mut:#665249}
/* barra de abajo y barras de Crear: texto en px para que no desborde con letra grande del sistema */
.bn{font-size:13px!important}
.c2fix .c2fb,.c2fix .c2go.c2fb{font-size:13px!important}
.c2fix .c2go:not(.c2fb){font-size:15px}
body:has(.c2fix){padding-bottom:calc(152px + env(safe-area-inset-bottom,0px))}
.c2hasfix{padding-bottom:12px}
/* contraste */
.c2fecha{background:#8a5a3c}
.c2tema{color:#7d4f33}
.c2temas.off{opacity:1}
.c2temas.off button{background:transparent;border-style:dashed;color:var(--mut)}
.c2temas.off button.on{background:var(--cr);color:var(--br);border-color:var(--crd)}
.hb small{opacity:1}
.gphone{background:linear-gradient(#705849,#4a372d)}
.q i{color:var(--cr)}
/* tamaños mínimos */
.c2fl{font-size:.8125rem;background:rgba(18,10,6,.84);border-radius:8px;padding:5px 9px}
.ctal li b{font-size:.8125rem!important}
.rtab td small{font-size:.8125rem!important}
button.sm-tt{min-height:44px;display:flex;align-items:center}
/* texto grande: nada se sale ni se solapa */
.c2vias{grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr))}
.plrow{grid-template-columns:1fr 1fr}.plrow label:last-child{grid-column:1/-1}
.plrow select{padding:10px 8px}
.c2sum{display:block;-webkit-line-clamp:unset;overflow:visible}
.eqh,.eqhero{height:auto}
.c2pn,.eqls small,.tt-red{overflow-wrap:anywhere}
.tt-rlh{flex-wrap:wrap}
/* desplegables heredados (Cómo se usa, Guía del método, Recursos, Mi cuenta): mismo aire que los de Crear, con flecha propia */
details.gd,details.c2gd,details.gd2,.rdet{padding-left:16px;padding-right:16px}
details.gd summary,details.c2gd summary,details.gd2 summary,.rdet summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px}
details.gd summary::-webkit-details-marker,details.c2gd summary::-webkit-details-marker,details.gd2 summary::-webkit-details-marker,.rdet summary::-webkit-details-marker{display:none}
details.gd summary:after,details.c2gd summary:after,details.gd2 summary:after,.rdet summary:after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--br);border-bottom:2px solid var(--br);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s ease}
details.gd[open]>summary:after,details.c2gd[open]>summary:after,details.gd2[open]>summary:after,.rdet[open]>summary:after{transform:rotate(-135deg);margin-top:4px}
.gb2{padding:2px 0 12px}
/* botones de una misma fila: mismo alto y reparto parejo */
.panel>.acts>.btn{flex:1 1 11rem}
.c2temas button small,.c2sub button small{opacity:1;font-weight:500}
.eqht p{margin-top:10px}
/* con la letra del sistema al doble */
.eqht h2{font-size:min(2rem,8.6vw);line-height:1.15;overflow-wrap:anywhere}
.eqhero .eqht h2{font-size:min(2.6rem,11vw)}
.eqht p{margin-top:12px}
.eqc b{line-height:1.2}.eqc small{display:block;margin-top:4px}
.c2gtit{margin-top:6px}
.fx-qb{grid-template-columns:repeat(auto-fit,minmax(min(100%,7rem),1fr))}
.fx-qb .btn.fx-b{overflow-wrap:anywhere;line-height:1.2}
.rmh{flex-wrap:wrap}.rmh .rver{min-width:0;overflow-wrap:anywhere}
.bv-pasa{overflow-y:auto}
.bv-p{justify-content:safe center}
.c2gplano b,.c2gplano p{overflow-wrap:anywhere}
/* Lo que no se dice: las etiquetas NO / MEJOR del mismo ancho para que el texto quede alineado */
.tt-rl p{padding-left:4.6rem}
.tt-rl p:before{width:3.8rem;text-align:center;padding:2px 0;box-sizing:border-box}
.panel .lead{font-size:.95rem;line-height:1.5}
/* Instalar: el aviso no pega con el botón; Revisa tu bio: los dos botones finales iguales (apilados si no caben) */
.isteps~.note{margin-bottom:16px}
.note+.acts{margin-top:16px}
.bio-rvacts{display:flex;flex-wrap:wrap;gap:10px}
.bio-rvacts .mini{flex:1 1 150px;min-height:44px;margin:0;text-align:center}

/* ===== C9 · cada cosa en su sitio: «Tu perfil» en Inicio, «Herramientas» en Crear, aviso de una sola vez ===== */
/* Inicio: bloque «Tu perfil» (dos o cuatro filas compactas con su icono) */
.pf9p{padding:12px 12px 10px}
.pf9p h3{margin:0 0 8px}
.pf9g{display:grid;gap:8px}
.pf9{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;background:var(--cr);border:0;border-radius:8px;padding:8px 12px;color:var(--br);font-family:inherit;cursor:pointer}
.pf9:hover{filter:brightness(.97)}
.pf9i{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--wh);color:var(--br)}
.pf9s{width:22px;height:22px}
.pf9t{flex:1;min-width:0}
.pf9t b{display:block;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.pf9t small{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:var(--mut)}
/* aviso «Hemos ordenado la app» */
.orden9{border-left:4px solid var(--br);padding:12px 14px}
.orden9>b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.15rem;letter-spacing:.02em;color:var(--br);margin-bottom:4px}
.orden9 ul{margin:0 0 8px;padding-left:18px}
.orden9 li{margin:3px 0;font-size:.95rem}
.orden9 .acts{margin:0}
/* Crear: interruptor de red + botón Herramientas en una sola fila */
.c9row{display:flex;gap:8px;align-items:stretch;margin:0 0 12px}
.c9row .tt-plat{flex:1;min-width:0;margin:0}
.c9row .tt-plat button{flex:1 1 0;min-width:0;font-size:13px;letter-spacing:.02em;padding-left:0;padding-right:0}
.c9herr{flex:none;min-height:44px;align-self:center;padding:0 12px 0 14px;border:1px solid var(--br);border-radius:24px;background:transparent;color:var(--br);font:700 13px/1 inherit;font-family:inherit;cursor:pointer}
.c9herr:after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 3px 8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg)}
.c9herr.on{background:var(--br);color:var(--cr)}
.c9herr.on:after{transform:rotate(-135deg);margin-bottom:-2px}
.c9pan{padding:10px 14px 6px}
.c9pan h3{margin:0 0 2px}
.c9pan .ml:first-of-type{margin-top:6px}
/* Semana y Recursos: entradas */
.sm9{display:flex;gap:8px;margin:0 0 14px}
.sm9b{flex:1;min-width:0;min-height:48px;padding:6px 8px;border:1px solid var(--br);border-radius:8px;background:var(--wh);color:var(--br);font:700 .9rem/1.2 inherit;font-family:inherit;cursor:pointer}
.sm9b:hover{filter:brightness(.97)}
.rc9{padding:6px 12px}
.rc9 .ml{margin:0;border:0;padding:8px 2px}

/* ===== C11 · «Mi proyecto» visual (el plan de compensación) y la zona en «Tu bio» ===== */
.ng-top .ng-int{margin:0 0 12px;padding:10px 12px;border-left:4px solid var(--br);background:var(--cr);color:var(--br);font-weight:700;font-size:.95rem;line-height:1.35;border-radius:0 6px 6px 0}
.ng-top .lead{margin:0}
.ng-ixg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ng-ixb{min-height:48px;padding:6px 10px;text-align:left;background:var(--cr);color:var(--br);border:0;border-radius:8px;font:700 13px/1.25 inherit;font-family:inherit;cursor:pointer;overflow-wrap:anywhere}
.ng-ixb:hover{filter:brightness(.97)}
.ng-s,.ng-s h3{scroll-margin-top:12px}
.ng-s>h3{margin:0 0 12px;padding-left:10px;border-left:4px solid var(--br);font-size:1.25rem;line-height:1.15}
.ng-s h3:focus{outline:none}
.ng-s .rres{margin:10px 0 0;padding-left:20px}
.ng-s .rres li{margin:6px 0;font-size:.95rem;line-height:1.5}
.ng-h{margin:16px 0 10px;font-size:1.05rem;color:var(--br)}
.ng-lead{margin:12px 0 4px;font-size:.95rem}
/* cifras clave */
.ng-cl{display:grid;gap:10px;margin:0 0 6px}
.ng-c{background:var(--cr);border-radius:10px;padding:12px 14px}
.ng-c p{margin:4px 0 0;font-size:.95rem;line-height:1.4}
.ng-n{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:2.1rem;line-height:1.05;letter-spacing:.02em;color:var(--br);overflow-wrap:anywhere}
/* niveles de bono: escalera con barras */
.ng-nv{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ng-nv li{display:grid;grid-template-columns:52px 1fr 108px;gap:8px;align-items:center;min-height:36px}
.ng-pc{font-family:AntonFT,Impact,sans-serif;font-size:1.2rem;color:var(--br);text-align:right}
.ng-bar{display:block;height:16px;border-radius:8px;background:var(--cr);overflow:hidden}
.ng-bar i{display:block;height:100%;border-radius:8px;background:var(--br)}
.ng-vg{font-size:13px;line-height:1.25;color:var(--ink)}
.ng-w0 i{width:6%}.ng-w1 i{width:18%}.ng-w2 i{width:30%}.ng-w3 i{width:42%}.ng-w4 i{width:54%}.ng-w5 i{width:66%}.ng-w6 i{width:78%}.ng-w7 i{width:89%}.ng-w8 i{width:100%}
/* ejemplos */
.ng-ej{margin:14px 0 4px;padding:14px;border:1px solid var(--crd);border-radius:10px;background:var(--crl)}
.ng-ejt{display:block;margin:0 0 10px;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;color:var(--br)}
.ng-eq{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.ng-eq>div{flex:1 1 92px;min-width:0;background:var(--wh);border:1px solid var(--crd);border-radius:8px;padding:8px 6px;text-align:center}
.ng-eq small{display:block;font-size:13px;line-height:1.25;color:var(--mut)}
.ng-eq b{display:block;margin-top:2px;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.15rem;line-height:1.15;color:var(--br);overflow-wrap:anywhere}
.ng-ej>p{margin:0 0 10px;font-size:.95rem;line-height:1.5}
.ng-ej>p.ng-ejn{margin:10px 0 0;font-size:13px;color:var(--mut)}
.ng-res{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:8px;background:var(--br);color:var(--cr)}
.ng-res small{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ng-res b{font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.6rem;line-height:1.1;text-align:right}
/* tablas */
.ng-t{width:100%;margin:12px 0 4px;border-collapse:collapse;font-size:.95rem}
.ng-t th,.ng-t td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--crd);vertical-align:middle}
.ng-t thead th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;background:var(--cr)}
.ng-t tbody th{font-weight:600;color:var(--ink)}
.ng-t tbody tr:nth-child(even){background:var(--crl)}
.ng-t .ng-v,.ng-t thead th:last-child{text-align:right;white-space:nowrap}
.ng-t .ng-v{font-weight:700;color:var(--br)}
.ng-tg .ng-v{font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.2rem;letter-spacing:.02em}
/* línea de progreso (bienvenida) */
.ng-ps{list-style:none;margin:12px 0 4px;padding:0 0 0 22px;border-left:3px solid var(--br);display:grid;gap:10px}
.ng-ps li{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--cr);border-radius:8px}
.ng-ps li:before{content:"";position:absolute;left:-31px;top:50%;width:13px;height:13px;margin-top:-6px;border-radius:50%;background:var(--br);border:3px solid var(--wh)}
.ng-ps small{font-size:.95rem;color:var(--ink)}
.ng-ps b{font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.4rem;color:var(--br)}
/* fichas */
.ng-fi{display:grid;gap:10px;margin:12px 0 4px}
.ng-f{background:var(--cr);border-radius:10px;padding:12px 14px}
.ng-f p{margin:4px 0 0;font-size:.95rem;line-height:1.4}
.ng-ft{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.1rem;letter-spacing:.03em;color:var(--br)}
.ng-f span{display:block;margin-top:2px;font-size:.95rem}
/* escalera de títulos */
.ng-esc{list-style:none;margin:6px 0 0;padding:0 0 0 18px;border-left:3px solid var(--br);display:grid;gap:10px}
.ng-esc li{position:relative;padding:10px 12px;border:1px solid var(--crd);border-radius:8px;background:var(--wh)}
.ng-esc li:before{content:"";position:absolute;left:-28px;top:18px;width:13px;height:13px;border-radius:50%;background:var(--br);border:3px solid var(--wh)}
.ng-et b{font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;color:var(--br)}
.ng-eb{margin-top:6px;display:grid;gap:6px}
.ng-pd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ng-pd small{flex:none;min-width:34px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.ng-pill{display:inline-block;padding:4px 10px;border-radius:14px;background:var(--cr);color:var(--br);font-size:13px;line-height:1.3;font-weight:600}
.ng-gv{background:var(--br);color:var(--cr)}
.ng-sin{font-size:13px;color:var(--mut)}
/* folleto y chips */
.ng-ch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.ng-ch .chip{min-height:44px}
.ng-fol{margin-top:14px;border-top:1px solid var(--crd);padding-top:4px}
.ng-fol summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--br)}
.ng-fol .rimgs{margin-top:6px}
/* ===== zona en «Tu bio» ===== */
.bz-box{margin-top:6px}
.bz-sug{margin:10px 0 0;padding:12px 14px;border-radius:8px;background:var(--cr);border-left:4px solid var(--br)}
.bz-sug p{margin:0 0 8px;font-weight:700;color:var(--br)}
.bz-sug .acts{margin:0}
.bz-sug .mini{min-height:44px}
.bz-list{margin:10px 0 0;max-height:236px;overflow-y:auto;border:1px solid var(--crd);border-radius:8px;background:var(--wh);-webkit-overflow-scrolling:touch}
.bz-it{display:flex;align-items:center;width:100%;min-height:44px;padding:6px 14px;border:0;border-bottom:1px solid var(--crl);background:transparent;color:var(--ink);font:inherit;font-size:1rem;text-align:left;cursor:pointer}
.bz-it:last-child{border-bottom:0}
.bz-it:hover{background:var(--crl)}
.bz-it.on{background:var(--br);color:var(--cr);font-weight:700}
.bz-it small{margin-left:auto;padding-left:10px;font-size:13px;opacity:.75}
.bz-none{margin:0;padding:12px 14px;font-size:.95rem;color:var(--mut)}
/* ===== Vender y recomendar: aviso y versiones de los mensajes ===== */
.eqaviso{margin:0 0 14px;padding:11px 14px;border-left:4px solid var(--br);border-radius:0 8px 8px 0;background:var(--cr);color:var(--br);font-size:.95rem;font-weight:600;line-height:1.4}
.eqmv{margin:0 0 6px}
.eqmv .acts{margin:2px 0 12px}
.eqmv .mini{min-height:44px}

/* ===== C12 · «Qué contestar cuando te dicen…» ===== */
.qc-head h2{margin-bottom:.3em}
.qc-vias{margin:14px 0 4px}
.qc-vias .chip{min-height:44px;padding-left:20px;padding-right:20px;font-size:.95rem}
.qc-l{display:block;margin:14px 0 6px;font-weight:700;color:var(--br);font-size:1rem}
.qc-q{display:block;width:100%;box-sizing:border-box;min-height:56px;padding:12px 14px;font-size:16px;border:2px solid var(--br);border-radius:10px;background:var(--wh);color:var(--ink);font-family:inherit}
.qc-q::placeholder{color:var(--mut)}
.qc-para{margin:10px 0 0}
.qc-n{margin:0 0 10px;font-size:.9375rem}
.qc-res{display:grid;gap:8px}
.qc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:10px 14px;text-align:left;background:var(--wh);border:1px solid var(--crd);border-radius:8px;color:var(--br);font-family:inherit;cursor:pointer}
.qc-row:after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--br);border-top:2px solid var(--br);transform:rotate(45deg);margin-right:2px}
.qc-row:hover{background:var(--crl)}
.qc-ft{display:block;min-width:0}
.qc-ft b{display:block;font-size:1rem;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.qc-ft small{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:var(--mut)}
.qc-tema{background:var(--wh);border:1px solid var(--crd);border-radius:8px;margin:0 0 10px;padding:0 12px}
.qc-tema>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;cursor:pointer;font-weight:700;color:var(--br)}
.qc-tema>summary::-webkit-details-marker{display:none}
.qc-tema>summary:after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--br);border-bottom:2px solid var(--br);transform:rotate(45deg);margin:-4px 4px 0 0}
.qc-tema[open]>summary:after{transform:rotate(-135deg);margin-top:4px}
.qc-tn{flex:1;min-width:0;line-height:1.3}
.qc-c{flex:none;min-width:28px;padding:2px 8px;border-radius:12px;background:var(--cr);color:var(--br);font-size:13px;font-weight:700;text-align:center}
.qc-tema .qc-res{padding:0 0 12px}
.qc-h3{margin:18px 0 8px;font-size:1.1rem}
.qc-otro{margin:4px 0 0;font-size:.9375rem}
.qc-falta{margin:14px 0 0;text-align:center;color:var(--mut);font-size:.9375rem}
.qc-nota{margin:18px 4px 8px;text-align:center;font-size:13px;line-height:1.45;color:var(--mut)}
/* ficha */
